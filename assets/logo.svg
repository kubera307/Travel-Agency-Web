<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="saffronGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9933" />
      <stop offset="100%" stop-color="#FF5722" />
    </linearGradient>
    <linearGradient id="amberGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC107" />
      <stop offset="100%" stop-color="#FF9800" />
    </linearGradient>
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#138808" />
      <stop offset="100%" stop-color="#00A86B" />
    </linearGradient>
    <linearGradient id="navyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1E36" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="3" stdDeviation="3" flood-opacity="0.25" flood-color="#0B1E36"/>
    </filter>
  </defs>

  <!-- Group: Emblem (Iconic Indian Auto-Rickshaw + Mobility Wheel) -->
  <g transform="translate(15, 10)" filter="url(#subtleShadow)">
    <!-- Base Background Circle / Shield -->
    <circle cx="50" cy="50" r="48" fill="#0B1E36" />
    <circle cx="50" cy="50" r="46" fill="none" stroke="url(#amberGradient)" stroke-width="2.5" stroke-dasharray="8 4" />
    
    <!-- Indian Tri-Color Arc Elements -->
    <path d="M 12 50 A 38 38 0 0 1 88 50" fill="none" stroke="url(#saffronGradient)" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 88 50 A 38 38 0 0 1 12 50" fill="none" stroke="url(#greenGradient)" stroke-width="4.5" stroke-linecap="round" />

    <!-- Stylized Auto-Rickshaw Body -->
    <!-- Roof / Canopy -->
    <path d="M 28 42 Q 40 26, 68 26 L 76 34 Q 78 38, 76 44 L 28 44 Z" fill="url(#amberGradient)" />
    <!-- Yellow / Saffron Hood Cap -->
    <path d="M 32 38 Q 42 29, 66 29 L 71 35 L 32 38 Z" fill="#FFE082" opacity="0.8" />
    <!-- Windshield -->
    <polygon points="65,34 74,34 72,44 63,44" fill="#E0F2FE" opacity="0.9" />
    
    <!-- Lower Body / Cabin -->
    <path d="M 25 44 L 75 44 L 72 62 Q 70 66, 64 66 L 32 66 Q 26 66, 25 60 Z" fill="#065F46" />
    <!-- Green Eco/Bharat stripe -->
    <rect x="25" y="47" width="49" height="5" fill="#34D399" />
    <!-- Headlight beam -->
    <polygon points="73,50 86,46 86,58 73,54" fill="#FEF08A" opacity="0.6" />
    <circle cx="73" cy="52" r="3" fill="#FFF" />

    <!-- Driver / Passenger silhouette indication -->
    <circle cx="52" cy="38" r="4" fill="#0B1E36" />
    <path d="M 46 44 Q 52 40, 58 44 Z" fill="#0B1E36" />

    <!-- Wheels (Iconic 3-wheeler auto geometry) -->
    <!-- Rear Wheel -->
    <circle cx="36" cy="66" r="10" fill="#1E293B" stroke="#F1F5F9" stroke-width="2.5" />
    <circle cx="36" cy="66" r="4.5" fill="url(#amberGradient)" />
    <!-- Front Wheel -->
    <circle cx="68" cy="66" r="9" fill="#1E293B" stroke="#F1F5F9" stroke-width="2.5" />
    <circle cx="68" cy="66" r="4" fill="url(#amberGradient)" />

    <!-- Ashoka Chakra Mini Center Element -->
    <circle cx="50" cy="50" r="7" fill="#FFF" stroke="#0038A8" stroke-width="1.5" />
    <line x1="50" y1="43" x2="50" y2="57" stroke="#0038A8" stroke-width="1" />
    <line x1="43" y1="50" x2="57" y2="50" stroke="#0038A8" stroke-width="1" />
    <line x1="45" y1="45" x2="55" y2="55" stroke="#0038A8" stroke-width="0.8" />
    <line x1="45" y1="55" x2="55" y2="45" stroke="#0038A8" stroke-width="0.8" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(128, 20)">
    <!-- "TRAVEL" Wordmark -->
    <text x="0" y="40" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="900" font-size="36" letter-spacing="1.5" fill="#0B1E36">TRAVEL</text>
    
    <!-- "INDIA" Wordmark with Saffron-Green vibrant touch -->
    <text x="156" y="40" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="900" font-size="36" letter-spacing="1.5" fill="#FF9933">IN</text>
    <text x="204" y="40" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="900" font-size="36" letter-spacing="1.5" fill="#1E3A8A">D</text>
    <text x="235" y="40" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="900" font-size="36" letter-spacing="1.5" fill="#138808">IA</text>

    <!-- Mana Yatri inspired Zero-Commission Badge -->
    <g transform="translate(290, 16)">
      <rect x="0" y="0" width="86" height="24" rx="12" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.2" />
      <circle cx="10" cy="12" r="4" fill="#10B981" />
      <text x="19" y="16" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="800" font-size="10.5" fill="#92400E" letter-spacing="0.5">0% COMM</text>
    </g>

    <!-- Tagline: People-First Open Mobility & Tours -->
    <text x="2" y="66" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="12.5" letter-spacing="2" fill="#4B5563">
      100% DIRECT TO DRIVER <tspan fill="#F59E0B">•</tspan> TOURS &amp; MOBILITY
    </text>

    <!-- ONDC / Community Protocol Indicator -->
    <text x="2" y="84" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="600" font-size="10" letter-spacing="1" fill="#9CA3AF">
      POWERED BY OPEN MOBILITY NETWORK • BHARAT
    </text>
  </g>
</svg>

